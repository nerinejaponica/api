name: Nerine Japonica CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# LEAST PRIVILEGE: JOBS ONLY READ THE REPO
permissions:
  contents: read

# CANCEL OLDER RUN OF THE SAME BRANCH WHEN A NEW PUSH ARRIVES
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # SAME CHECKS AS "make check" ON LOCAL: gofmt, go vet, go test
      - name: Check
        run: make check

      - name: Build
        run: go build ./...

      # COVERAGE TABLE IN THE LOG, coverage.out FOR SONARQUBE
      - name: Coverage
        run: make cover

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  security:
    name: Security guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # KNOWN VULNERABILITIES IN DEPENDENCIES AND THE STANDARD LIBRARY
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@ef4cb2f7cae47fe3e21fc596455f694951867b29 # v1.10.0
          govulncheck ./...

      # SECRETS COMMITTED BY ACCIDENT, SCANS THE WHOLE GIT HISTORY
      # USE THE OPEN SOURCE BINARY, THE gitleaks-action NEEDS A PAID LICENSE FOR ORGANIZATIONS
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
          gitleaks git --redact --verbose

  sonarqube:
    name: SonarQube scan
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # SONAR NEEDS FULL HISTORY TO BLAME NEW CODE CORRECTLY
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: coverage

      # SKIP, NOT FAIL, UNTIL THE SONAR SECRET IS CONFIGURED
      - name: Check Sonar secret
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN is not set, SonarQube scan skipped."

      - name: Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          # EMPTY SECRET MEANS EMPTY URL, SO FALL BACK TO SONARCLOUD
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      # FAIL THIS JOB WHEN THE QUALITY GATE FAILS
      - name: Quality gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
