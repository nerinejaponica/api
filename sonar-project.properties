# SonarCloud: organization dan project key dari halaman Information project
sonar.organization=nerinejaponica
sonar.projectKey=nerinejaponica_api
sonar.projectName=nerine-japonica-api

# Kode yang dianalisis, test dipisah supaya tidak dihitung sebagai kode produksi
sonar.sources=api,cmd,internal
sonar.tests=test
sonar.test.inclusions=test/**/*_test.go
sonar.exclusions=internal/db/**,**/testdata/**

# Hasil make cover (go test -coverprofile)
sonar.go.coverage.reportPaths=coverage.out
# Hasil sqlc tidak dihitung ke coverage
sonar.coverage.exclusions=internal/db/**,cmd/**,api/**,test/**
